<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TecArch · Finance</title>
<meta name="theme-color" content="#1d2128">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#2c5282; --green-d:#1e3a5f; --green-l:#eaf0f8;
  --orange:#f37321; --orange-l:#fff1e7;
  --ink:#1d2128; --muted:#6a707a; --line:#e5e6e9; --bg:#f6f6f4; --card:#fff;
  --head:Montserrat,Inter,system-ui,sans-serif;
  --red:#c62828; --red-l:#fdecec; --amber:#b26a00; --amber-l:#fff4e0; --ok:#2e7d32; --ok-l:#e8f5e9;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
h1,h2,h3{font-family:var(--head);letter-spacing:-.01em}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td.num,th.num{text-align:right}

/* top bar (shared with Tracker) */
.ab{background:#1d2128;color:#fff;position:sticky;top:0;z-index:30;border-bottom:1px solid #0f1215}
.ab-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:0 20px;min-height:60px}
.ab-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;flex:none}
.ab-brand img{height:30px;width:auto;display:block}
.ab-brand span{font:600 11px/1 Montserrat,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#aab0ba;border-left:1px solid #3a404a;padding-left:12px}
.ab-nav{display:flex;gap:2px;align-self:stretch;margin:0}
.ab-nav a{font:500 14px Montserrat,sans-serif;color:#c3c8d0;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:3px 14px 0;display:flex;align-items:center;gap:6px;text-decoration:none;min-height:60px;white-space:nowrap}
.ab-nav a:hover{color:#fff;background:rgba(255,255,255,.06)}
.ab-nav .on,.ab-nav .on:hover{color:#fff;border-bottom-color:#f37321;background:none}
.ab-sp{flex:1}
.ab-me{font:400 12px/1.25 Inter,sans-serif;color:#aab0ba;text-align:right}.ab-me b{display:block;color:#fff;font-weight:600;font-size:13px}
.ab-out{font:500 13px Inter,sans-serif;color:#fff;background:transparent;border:1px solid #4a515c;border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px}
.ab-out:hover{border-color:#fff}
@media(max-width:760px){.ab-long{display:none}.ab-in{flex-wrap:wrap;gap:0 12px;padding:8px 14px 0;min-height:0}.ab-nav{order:3;width:100%;overflow-x:auto}.ab-nav a{min-height:46px;padding:0 12px}.ab-me{display:none}.ab-brand span{display:none}}

/* finance sub-navigation */
.sub{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:20}
.sub-in{max-width:1320px;margin:0 auto;display:flex;gap:2px;padding:0 20px;overflow-x:auto}
.sub button{border:0;background:none;padding:12px 14px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.sub button:hover{color:var(--ink)}
.sub button.on{color:var(--ink);border-bottom-color:var(--orange)}
.badge{background:var(--orange);color:#fff;border-radius:999px;font:600 11px/1.4 Inter,sans-serif;padding:1px 7px}
@media(max-width:760px){.sub{top:0;position:relative}}

main{max-width:1320px;margin:0 auto;padding:24px 20px 90px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.phead h1{margin:0;font-size:26px;font-weight:700}
.phead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:#c9cdd3}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.accent{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
.btn.accent:hover{background:#d95f12;border-color:#d95f12}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--red)}
.btn.wa{color:#128c4a}
.btn:disabled{opacity:.55;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--orange-l);border-color:var(--orange)}
textarea{resize:vertical;min-height:64px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fg .w2,.fg3 .w3{grid-column:1/-1}
@media(max-width:640px){.fg,.fg3{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);white-space:nowrap}
.chk input{width:auto}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;text-align:left}
.kpi:hover{border-color:#c8cbd1}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.kpi .n{font:700 24px/1.2 var(--head);margin-top:4px}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.in .n{color:var(--green)}
.kpi.out .n{color:var(--orange)}
.kpi.warn .n{color:var(--red)}

.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media(max-width:980px){.cols{grid-template-columns:1fr}}
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.sec h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec h3 small{font:400 13px Inter,sans-serif;color:var(--muted)}
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0;padding-top:2px}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--muted)}
.row .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row .btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--green-l);color:var(--green-d);white-space:nowrap}
.pill.red{background:var(--red-l);color:var(--red)}
.pill.amber{background:var(--amber-l);color:var(--amber)}
.pill.grey{background:#eceff1;color:#546e7a}
.pill.ok{background:var(--ok-l);color:var(--ok)}
.pill.orange{background:var(--orange-l);color:#b4510f}
.flag{color:var(--amber);font-weight:700}
.muted{color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--green)}
.note{background:var(--amber-l);color:#6d4500;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.note.blue{background:var(--green-l);color:var(--green-d)}

table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f8f8f6;font-weight:600;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#fbfbfa}
tfoot td{font-weight:700;background:#f8f8f6}
.tablewrap{overflow-x:auto;border-radius:var(--radius)}
td .sub2{display:block;font-size:12.5px;color:var(--muted)}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(15,20,25,.38);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(820px,100%);height:100%;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.15);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:.5}to{transform:none;opacity:1}}
.dhead{background:#fff;border-bottom:1px solid var(--line);padding:14px 16px 0;position:sticky;top:0;z-index:2}
.dhead .r1{display:flex;gap:10px;align-items:flex-start;padding-bottom:12px}
.dhead h2{margin:0;font-size:19px}
.dhead .sub3{font-size:13px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--orange)}
.tabs .c{font-size:11px;background:var(--bg);border-radius:999px;padding:1px 6px;margin-left:3px}
.dbody{padding:16px}
.dbody .sec{margin-bottom:14px}
.m4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.m4 div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.m4 small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.m4 b{font-size:16px;font-variant-numeric:tabular-nums}
@media(max-width:640px){.m4{grid-template-columns:repeat(2,1fr)}}
.formfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.formfoot .left{margin-right:auto}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gbox{max-width:440px;text-align:center}.gbox img{height:40px;margin-bottom:18px}.gbox h2{font-size:26px;margin:0 0 8px}.gbox p{color:var(--muted);margin:0 0 18px}

/* chart */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* print */
#printRoot{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  body.printing > *:not(#printRoot){display:none!important}
  body.printing #printRoot{display:block}
}
.doc{font-family:Inter,Arial,sans-serif;color:#111;max-width:780px;margin:0 auto;font-size:10.5pt}
.doc .lh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #f37321;padding-bottom:10px;margin-bottom:14px;gap:16px}
.doc .lh img{height:46px}
.doc .co{font-size:9pt;color:#444;text-align:right;line-height:1.5}
.doc .co b{font-size:11pt;color:#111}
.doc .ttl{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.doc .ttl h1{font:700 18pt Montserrat,Arial,sans-serif;margin:0;letter-spacing:.5px}
.doc .ttl .meta{text-align:right;font-size:9.5pt;line-height:1.6}
.doc .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.doc .box{border:1px solid #ccc;border-radius:4px;padding:8px 10px}
.doc .box small{display:block;font-size:8pt;color:#666;text-transform:uppercase;font-weight:700;letter-spacing:.4px;margin-bottom:2px}
.doc table{border:1px solid #bbb;border-radius:0}
.doc th,.doc td{padding:6px 8px;border:1px solid #ccc;font-size:10pt}
.doc th{background:#f3f3f1;color:#333}
.doc .tot{width:55%;margin-left:auto;margin-top:10px}
.doc .tot td{border:0;border-bottom:1px solid #ddd;padding:5px 8px}
.doc .tot tr.big td{font-weight:700;font-size:12pt;border-bottom:2px solid #111}
.doc .words{font-style:italic;margin-top:8px;font-size:10pt}
.doc .pay{margin-top:14px;white-space:pre-wrap}
.doc .sign{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:50px;font-size:9.5pt}
.doc .sign div{border-top:1px solid #333;padding-top:4px;text-align:center}
.doc .foot{margin-top:24px;font-size:8.5pt;color:#666;text-align:center;border-top:1px solid #ddd;padding-top:8px}
.doc h3{font-size:10.5pt;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #ccc;padding-bottom:3px;margin:16px 0 8px}
</style>
</head>
<body>
<div id="gate" class="gate"><div class="gbox"><img src="../brand/tecarch-logo.png" alt="TecArch"><h2>TecArch Finance</h2><p id="gateMsg">Checking your sign-in…</p><a class="btn" id="gateLink" href="../" style="display:none">Open the TecArch Workspace</a></div></div>

<header class="ab">
  <div class="ab-in">
    <a class="ab-brand" href="../"><img src="../brand/tecarch-logo.png" alt="TecArch"><span>Workspace</span></a>
    <nav class="ab-nav" aria-label="Main">
      <a href="../">Projects</a>
      <a href="../#tasks">Tasks</a>
      <a href="../#team">Team</a>
      <a href="./" class="on" aria-current="page">Finance</a>
      <a href="../watermark/"><span>Watermark<span class="ab-long"> Studio</span></span></a>
    </nav>
    <div class="ab-sp"></div>
    <div class="ab-me"><b id="abName"></b><span id="abRole"></span></div>
    <button type="button" class="ab-out" id="abOut">Sign out</button>
  </div>
</header>
<div class="sub"><div class="sub-in" id="subnav">
  <button data-v="dash" class="on">Overview</button>
  <button data-v="jobs">Jobs &amp; clients</button>
  <button data-v="work">Outsourcing</button>
  <button data-v="tx">Transactions</button>
  <button data-v="accounts">Accounts</button>
  <button data-v="contacts">Contacts</button>
  <button data-v="reports">Reports</button>
  <button data-v="review">To check <span class="badge hidden" id="revBadge"></span></button>
</div></div>

<main id="main"></main>
<div id="drawerRoot"></div>
<div id="printRoot"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient('https://cslndhcboybvejwcbhuj.supabase.co', 'sb_publishable_UwAtQDV7CZMc7IVlbQMt5g_RF1czA09');

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N = v => Number(v || 0);
const money = n => 'Rs ' + N(n).toLocaleString('en-IN', {maximumFractionDigits:0});
const today = () => { const t = new Date(); t.setMinutes(t.getMinutes() - t.getTimezoneOffset()); return t.toISOString().slice(0,10); };
const addDays = (d, n) => { const t = new Date(d + 'T00:00:00'); t.setDate(t.getDate() + n); t.setMinutes(t.getMinutes() - t.getTimezoneOffset()); return t.toISOString().slice(0,10); };
const fdate = d => d ? new Date(String(d).slice(0,10) + 'T00:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
const month = d => new Date(String(d).slice(0,10) + 'T00:00:00').toLocaleDateString('en-GB', {month:'short', year:'numeric'});
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(), 2800); }
function fail(e){ console.error(e); toast('⚠ ' + (e?.message || e)); }
const val = id => { const el = document.getElementById(id); if(!el) return null; if(el.type==='checkbox') return el.checked; const v = el.value.trim(); return v === '' ? null : v; };
const numv = id => { const v = val(id); return v === null ? null : Number(String(v).replace(/,/g,'')); };

const MODES = {cash:'Cash', bank_transfer:'Bank transfer', cheque:'Cheque', fonepay:'FonePay', esewa:'eSewa', khalti:'Khalti', other:'Other'};
const MODE_ACC = {cash:'cash', bank_transfer:'company_bank', cheque:'company_bank', fonepay:'wallet', esewa:'wallet', khalti:'wallet'};
const JOB_STATUS = {quote:'Quote', active:'Active', completed:'Completed', on_hold:'On hold', dispute:'Dispute', cancelled:'Cancelled'};
const KINDS = {client:'Client', partner:'Partner firm / referrer', outsourced:'Outsourced professional', supplier:'Supplier', staff:'Staff', other:'Other'};
const ACC_KIND = {company_bank:'Company bank', personal_bank:'Personal bank (director)', cash:'Cash', wallet:'Wallet / QR'};
const WORK_TYPES = ['Structure','Estimation','3D visualisation','Drafting / drawings','Site supervision','Sanitary / plumbing','Electrical','Interior','Survey','Other'];
const EXP_CATS = ['Office rent','Salary / wages','Printing & stationery','Fuel & travel','Software & subscriptions','Internet & phone','Municipality / government fees','Marketing','Bank charges','Tax payment','Other'];

const S = { me:null, view:'dash', jobsFilter:'open', jobsQ:'', jobsPayer:'', workWorker:'', workOpen:true, txType:'all', txAcc:'', contactsKind:'client', contactsQ:'', repTab:'monthly' };

/* ================= boot ================= */
const gm = t => { $('#gateMsg').textContent = t; $('#gateLink').style.display = ''; };
$('#abOut').onclick = async () => { try { await sb.auth.signOut(); } catch(e){} location.href = '../'; };
async function boot(){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(!session) return gm('Please sign in to the TecArch Workspace first, then open Finance again.');
    const { data:me } = await sb.from('team_members').select('id,role,full_name').eq('auth_user_id', session.user.id).eq('active', true).maybeSingle();
    if(!me) return gm("Your account isn't on the TecArch team yet.");
    if(!['admin','accountant'].includes(me.role)) return gm('Finance is only open to the admin and the accountant. Ask the admin if you need access.');
    S.me = me; S.admin = me.role === 'admin';
    $('#abName').textContent = me.full_name || ''; $('#abRole').textContent = S.admin ? 'Admin' : 'Accountant';
    await loadAll();
    $('#gate').remove();
    route();
  }catch(e){ console.error(e); gm("Couldn't load Finance. Check your internet connection and reload the page."); }
}

async function loadAll(){
  const t = (name, order, opts) => { let q = sb.from(name).select('*'); if(order) q = q.order(order, opts || {ascending:true}); return q; };
  const res = await Promise.all([
    t('fin_party_balances','name'), t('fin_account_balances','id'), t('fin_job_summary','code'),
    t('fin_milestone_status','due_date'), t('fin_invoices','id',{ascending:false}), t('fin_receipts','id',{ascending:false}),
    t('fin_work_order_summary','id'), t('fin_payouts','id',{ascending:false}), t('fin_expenses','spent_on',{ascending:false}),
    t('fin_transfers','moved_on',{ascending:false}), t('fin_alerts'), t('fin_monthly','month'), t('fin_settings'),
    sb.from('projects').select('id,client_name,project_type').order('client_name')
  ]);
  const err = res.find(r => r.error); if(err) throw err.error;
  [S.parties, S.accounts, S.jobs, S.milestones, S.invoices, S.receipts, S.wos, S.payouts, S.expenses, S.transfers, S.alerts, S.monthly, S.settingsRows, S.projects] = res.map(r => r.data || []);
  S.set = Object.fromEntries(S.settingsRows.map(r => [r.key, r.value || '']));
  S.P = new Map(S.parties.map(p => [p.id, p])); S.A = new Map(S.accounts.map(a => [a.id, a])); S.J = new Map(S.jobs.map(j => [j.id, j])); S.W = new Map(S.wos.map(w => [w.id, w]));
  const rev = S.jobs.filter(j => j.needs_review).length + S.wos.filter(w => w.needs_review).length;

async function resolveParty(name, kind, phone){
  if(!name) return null;
  const hit = S.parties.find(p => p.name.trim().toLowerCase() === name.trim().toLowerCase());
  if(hit) return hit.id;
  const { data, error } = await sb.from('fin_parties').insert({ name:name.trim(), kind, phone: phone || null }).select().single();
  if(error) throw error;

}
async function save(table, id, obj){

}

function phoneIntl(p){ let d = String(p || '').replace(/\D/g, ''); if(d.length === 10 && d.startsWith('9')) d = '977' + d; return d; }
const waLink = (phone, text) => `https://wa.me/${phoneIntl(phone)}?text=${encodeURIComponent(text)}`;

function csv(name, rows){
  const s = rows.map(r => r.map(c => { const v = String(c ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + s], {type:'text/csv'})); a.download = name + '.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function words(n){
  n = Math.round(N(n)); if(n === 0) return 'Zero';
  const a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two = x => x < 20 ? a[x] : b[Math.floor(x/10)] + (x % 10 ? ' ' + a[x % 10] : '');
  const three = x => (x >= 100 ? a[Math.floor(x/100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? two(x % 100) : '');
  const parts = []; const cr = Math.floor(n / 1e7); n %= 1e7; const lk = Math.floor(n / 1e5); n %= 1e5; const th = Math.floor(n / 1000); n %= 1000;
  if(cr) parts.push(three(cr) + ' Crore'); if(lk) parts.push(two(lk) + ' Lakh'); if(th) parts.push(two(th) + ' Thousand'); if(n) parts.push(three(n));
  return parts.join(' ');
}

function openJob(id, tab='overview'){
  const j = id ? S.J.get(id) : null;

  const ms = j ? S.milestones.filter(m => m.job_id === id).sort((a, b) => (a.due_date || '9').localeCompare(b.due_date || '9') || a.sort_order - b.sort_order) : [];
  const rc = j ? S.receipts.filter(r => r.job_id === id) : [];
  const inv = j ? S.invoices.filter(i => i.job_id === id) : [];
  const wo = j ? S.wos.filter(w => w.job_id === id) : [];
  const tabs = j ? [['overview','Overview'],['schedule','Payment schedule', ms.length],['payments','Payments', rc.length],['invoices','Requests & invoices', inv.length],['outsourcing','Outsourcing', wo.length]] : null;
  const ov = drawer(dhead(j ? esc(j.title) : 'New job', j ? `${esc(j.code || '')} · ${statusPill(j.status)}${j.bill_to_id && j.bill_to_id !== j.client_id ? ' · pays via ' + esc(j.bill_to_name) : ''}` : 'Create a job to track its fee, schedule and payments', tabs, tab) + `<div class="dbody" id="jBody"></div>`);
  $$('[data-tab]', ov).forEach(b => b.onclick = () => openJob(id, b.dataset.tab));
  const body = $('#jBody');
  if(!j || tab === 'overview') return jobOverview(j, body, ms);
  if(tab === 'schedule') return jobSchedule(j, body, ms);
  if(tab === 'payments') return jobPayments(j, body, rc);
  if(tab === 'invoices') return jobInvoices(j, body, inv, ms);
  if(tab === 'outsourcing') return jobOutsourcing(j, body, wo);
}

  </div>

   <div class="acts" style="margin-bottom:12px;${N(j.contract_amount) - tot > 0 ? '' : 'display:none'}"><span class="muted" style="align-self:center">Quick split of ${money(N(j.contract_amount) - tot)}:</span>

   </form></div>`;

function invoiceText(i){
  const j = S.J.get(i.job_id);
  return `Namaste ${j.bill_to_name} ji,\n${i.kind === 'tax_invoice' ? 'Tax invoice' : 'Payment request'} ${i.number} from ${S.set.company_name}\n\nFor: ${i.description}\nAmount: ${money(i.subtotal)}${N(i.vat_amount) ? `\nVAT 13%: ${money(i.vat_amount)}\nTotal: ${money(i.total)}` : ''}\n${i.due_date ? 'Please pay by: ' + fdate(i.due_date) + '\n' : ''}\nAgreed fee: ${money(j.contract_amount)} · Received so far: ${money(j.received)}\n${S.set.bank_details ? '\nPayment details:\n' + S.set.bank_details + '\n' : ''}\nThank you,\nTecArch · ${S.set.company_phone}`;

async function invoiceAction(i, act){
  const j = S.J.get(i.job_id); const party = S.P.get(i.bill_to_id) || S.P.get(j.client_id);
  const markSent = async via => { if(i.status === 'draft'){ await sb.from('fin_invoices').update({status:'sent', sent_via:via, sent_at:new Date().toISOString()}).eq('id', i.id); await refresh(); openJob(j.id, 'invoices'); } };
  if(act === 'print') return printInvoice(i);
  if(act === 'wa'){ if(!party?.phone) toast('No phone number saved for ' + (party?.name || 'this contact') + '. Choose the chat in WhatsApp.'); window.open(party?.phone ? waLink(party.phone, invoiceText(i)) : 'https://wa.me/?text=' + encodeURIComponent(invoiceText(i)), '_blank'); return markSent('whatsapp'); }
  if(act === 'viber'){ location.href = viberLink(invoiceText(i)); return markSent('viber'); }
  if(act === 'mail'){ window.open(gmailLink(party?.email, `${i.kind === 'tax_invoice' ? 'Tax invoice' : 'Payment request'} ${i.number}: ${j.title}`, invoiceText(i) + '\n\n(PDF attached)'), '_blank'); return markSent('email'); }
  if(act === 'paid'){ await sb.from('fin_invoices').update({status:'paid'}).eq('id', i.id); toast('Marked paid. Record the payment if you haven\'t yet.'); await refresh(); return openJob(j.id, 'invoices'); }
  if(act === 'void'){ if(!confirm(`Void ${i.number}? The number stays used.`)) return; await sb.from('fin_invoices').update({status:'void'}).eq('id', i.id); await refresh(); return openJob(j.id, 'invoices'); }
}

/* ---------- receipt form ---------- */
function openReceipt(id, jobId){
  const r = id ? S.receipts.find(x => x.id === id) : null;
  const j0 = S.J.get(r?.job_id || jobId);
  const openInv = j0 ? S.invoices.filter(i => i.job_id === j0.id && ['sent','draft'].includes(i.status)) : [];
  drawer(dhead(r ? 'Payment received' : 'Record payment received', j0 ? esc(jobLabel(j0)) : 'Money that came in from a client or partner') + `<div class="dbody"><div class="sec"><form id="rForm" class="fg">
    ${j0 ? '' : `<div class="w2"><label class="f">Job</label><select id="rJob" required>${jobOptions(null, true)}</select></div>`}
    <div><label class="f">Amount received (Rs)</label><input id="rAmt" required inputmode="decimal" value="${r ? r.amount : (j0 && N(j0.due) > 0 ? j0.due : '')}"></div>
    <div><label class="f">Date</label><input id="rDate" type="date" value="${r ? (r.received_on || '') : today()}"></div>
    <div><label class="f">Payment method</label><select id="rMode">${modeOptions(r?.mode)}</select></div>
    <div><label class="f">Went into account</label><select id="rAcc">${accOptions(r?.account_id)}</select><div class="hint">If it came to your personal account, choose it here. The system tracks it as company money you are holding.</div></div>
    <div><label class="f">Payment from</label><input id="rPayer" list="dlP" value="${esc(r ? pname(r.payer_id) : (j0?.bill_to_name || ''))}"></div>
    <div><label class="f">Paid by (person)</label><input id="rBy" value="${esc(r?.paid_by_name || '')}" placeholder="e.g. client's son"></div>
    <div><label class="f">Reference / cheque no.</label><input id="rRef" value="${esc(r?.reference || '')}"></div>
    <div><label class="f">VAT included in this amount</label><input id="rVat" inputmode="decimal" value="${r ? (N(r.vat_amount) || '') : ''}" placeholder="0"><div class="hint">Only for payments against a tax invoice with VAT.</div></div>
    ${openInv.length && !r ? `<div class="w2"><label class="f">Against request / invoice</label><select id="rInv"><option value="">—</option>${openInv.map(i => `<option value="${i.id}" data-vat="${i.vat_amount}" data-tot="${i.total}">${esc(i.number)} · ${money(i.total)}</option>`).join('')}</select></div>` : ''}
    <div class="w2"><label class="f">Note</label><input id="rNote" value="${esc(r?.note || '')}"></div>
    ${partyList('dlP')}
    <div class="w2 formfoot">${r && S.admin ? '<button type="button" class="btn ghost danger left" id="rDel">Delete</button>' : ''}${r ? '<button type="button" class="btn" id="rPrint">Print receipt</button>' : ''}<button type="button" class="btn" data-close>Cancel</button><button class="btn primary">${r ? 'Save' : 'Save payment'}</button></div>
  </form></div></div>`);
  $('#rMode').onchange = () => { const a = defaultAcc(val('rMode')); if(a && !val('rAcc')) $('#rAcc').value = a; };
  if($('#rJob')) $('#rJob').onchange = () => { const j = S.J.get(Number(val('rJob'))); if(j){ $('#rAmt').value = N(j.due) || ''; $('#rPayer').value = j.bill_to_name || ''; } };
  if($('#rInv')) $('#rInv').onchange = e => { const o = e.target.selectedOptions[0]; if(o?.dataset.tot){ $('#rAmt').value = o.dataset.tot; $('#rVat').value = N(o.dataset.vat) || ''; } };
  if($('#rPrint')) $('#rPrint').onclick = () => printReceipt(r);
  if($('#rDel')) $('#rDel').onclick = async () => { if(await remove('fin_receipts', r.id, 'this payment')){ await refresh(); closeDrawer(); } };
  $('#rForm').onsubmit = async e => { e.preventDefault();
    try{
      const jobId2 = j0?.id || Number(val('rJob'));
      const obj = { job_id:jobId2, amount:numv('rAmt'), received_on:val('rDate'), mode:val('rMode'), account_id:val('rAcc') ? Number(val('rAcc')) : null, payer_id:await resolveParty(val('rPayer'), 'client'), paid_by_name:val('rBy'), reference:val('rRef'), vat_amount:numv('rVat') || 0, note:val('rNote') };
      if(!r && $('#rInv') && val('rInv')) obj.invoice_id = Number(val('rInv'));
      if(!obj.account_id && !confirm('No account chosen. Save without saying where the money went?')) return;
      const saved = await save('fin_receipts', r?.id, obj); if(!saved) return;
      if(obj.invoice_id){ const inv = S.invoices.find(i => i.id === obj.invoice_id); if(inv && N(obj.amount) >= N(inv.total)) await sb.from('fin_invoices').update({status:'paid'}).eq('id', inv.id); }
      await refresh(); toast('Payment saved');
      const j = S.J.get(jobId2); const party = S.P.get(obj.payer_id);
      if(!r && party?.phone && confirm('Send a thank-you receipt message on WhatsApp?')) window.open(waLink(party.phone, `Namaste ${party.name} ji,\nWe have received ${money(obj.amount)} for ${j.title}${j.code ? ' (' + j.code + ')' : ''}. Thank you!\nReceived to date: ${money(j.received)} · Balance: ${money(j.due)}\n– ${S.set.company_name}`), '_blank');
      openJob(jobId2, 'payments');
    }catch(err){ fail(err); }
  };
}

   ${pays.length ? `<div class="rows">${pays.map(p => `<div class="row" data-po="${p.id}" style="cursor:pointer"><div class="grow"><b>${fdate(p.paid_on) || 'No date'}</b><small>${MODES[p.mode] || '—'} · ${esc(S.A.get(p.account_id)?.name || 'account not recorded')}${N(p.tds_amount) ? ' · TDS ' + money(p.tds_amount) : ''}</small></div><div class="amt">${money(p.gross_amount)}</div></div>`).join('')}</div>` : '<p class="muted">Nothing paid yet.</p>'}</div>` : ''}

function openPayout(id, woId){
  const p = id ? S.payouts.find(x => x.id === id) : null;
  const w = S.W.get(p?.work_order_id || woId);
  const worker = w ? S.P.get(w.worker_id) : null;
  const rate = N(worker?.tds_rate);
  const unpaid = S.wos.filter(x => N(x.balance) > 0 && x.status !== 'cancelled');
  drawer(dhead(p ? 'Payment to outsourced person' : 'Pay outsourced work', w ? `${esc(w.worker_name)} · ${esc(w.work_type)} · ${esc(w.job_title || w.client_label || '')}` : '') + `<div class="dbody"><div class="sec"><form id="pForm" class="fg">
    ${w ? '' : `<div class="w2"><label class="f">Work order</label><select id="pWo" required><option value="">— choose —</option>${unpaid.map(x => `<option value="${x.id}">${esc(x.worker_name)} · ${esc(x.work_type)} · ${esc(x.job_title || x.client_label || '')}: balance ${money(x.balance)}</option>`).join('')}</select></div>`}
    <div><label class="f">Amount (counts against the fee)</label><input id="pGross" required inputmode="decimal" value="${p ? p.gross_amount : (w ? w.balance : '')}"></div>
    <div><label class="f">TDS deducted (Rs)</label><input id="pTds" inputmode="decimal" value="${p ? (N(p.tds_amount) || '') : (w && rate ? Math.round(N(w.balance) * rate / 100) : '')}"><div class="hint" id="pRate">${rate ? `Their TDS rate: ${rate}%` : 'Set this person\'s TDS rate on their contact page.'}</div></div>
    <div><label class="f">Net paid to them</label><input id="pNet" disabled></div>
    <div><label class="f">Date</label><input id="pDate" type="date" value="${p ? (p.paid_on || '') : today()}"></div>
    <div><label class="f">Method</label><select id="pMode">${modeOptions(p?.mode)}</select></div>
    <div><label class="f">Paid from account</label><select id="pAcc">${accOptions(p?.account_id)}</select></div>
    <div><label class="f">Reference</label><input id="pRef" value="${esc(p?.reference || '')}"></div>
    <div><label class="f">Note</label><input id="pNote" value="${esc(p?.note || '')}"></div>
    <div class="w2 formfoot">${p && S.admin ? '<button type="button" class="btn ghost danger left" id="pDel">Delete</button>' : ''}${p ? '<button type="button" class="btn" id="pVoucher">Print voucher</button>' : ''}<button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save payment</button></div>
  </form></div></div>`);
  const upd = () => { $('#pNet').value = money((numv('pGross') || 0) - (numv('pTds') || 0)); };
  $('#pGross').oninput = () => { const r2 = N((S.P.get(S.W.get(Number(val('pWo')) || w?.id)?.worker_id))?.tds_rate); if(r2 && !p) $('#pTds').value = Math.round((numv('pGross') || 0) * r2 / 100) || ''; upd(); };
  $('#pTds').oninput = upd; upd();
  $('#pMode').onchange = () => { const a = defaultAcc(val('pMode')); if(a && !val('pAcc')) $('#pAcc').value = a; };
  if($('#pWo')) $('#pWo').onchange = () => { const x = S.W.get(Number(val('pWo'))); if(!x) return; const r2 = N(S.P.get(x.worker_id)?.tds_rate); $('#pGross').value = x.balance; $('#pTds').value = r2 ? Math.round(N(x.balance) * r2 / 100) : ''; $('#pRate').textContent = r2 ? `Their TDS rate: ${r2}%` : 'No TDS rate set for this person.'; upd(); };
  if($('#pDel')) $('#pDel').onclick = async () => { if(await remove('fin_payouts', p.id, 'this payment')){ await refresh(); closeDrawer(); } };
  if($('#pVoucher')) $('#pVoucher').onclick = () => printVoucher(p);
  $('#pForm').onsubmit = async e => { e.preventDefault();
    const wo = w || S.W.get(Number(val('pWo'))); if(!wo) return toast('Choose a work order');
    const obj = { work_order_id:wo.id, worker_id:wo.worker_id, gross_amount:numv('pGross'), tds_amount:numv('pTds') || 0, paid_on:val('pDate'), mode:val('pMode'), account_id:val('pAcc') ? Number(val('pAcc')) : null, reference:val('pRef'), note:val('pNote') };
    if(N(obj.tds_amount) > N(obj.gross_amount)) return toast('TDS cannot be more than the amount');
    const saved = await save('fin_payouts', p?.id, obj); if(!saved) return;
    if(!p && N(obj.gross_amount) >= N(wo.balance)) await sb.from('fin_work_orders').update({status:'completed'}).eq('id', wo.id).eq('status', 'ongoing');
    toast('Payment saved'); await refresh(); openWO(wo.id);
  };
}

  <div class="sign"><div>Received by (${esc(worker?.name || '')})</div><div>For ${esc(S.set.company_name)}<br>Approved by</div></div>`, `Voucher ${worker?.name || ''} ${fdate(p.paid_on)}`);
}

/* ================= TRANSACTIONS ================= */
function txRows(){
  const rows = [];
  S.receipts.forEach(r => { const j = S.J.get(r.job_id); rows.push({type:'in', date:r.received_on, label:`${pname(r.payer_id) || j?.bill_to_name || ''}`, sub:`${j?.code || ''} ${j?.title || ''}`, acc:r.account_id, mode:r.mode, amt:N(r.amount), open:() => openReceipt(r.id)}); });
  S.payouts.forEach(p => { const w = S.W.get(p.work_order_id); rows.push({type:'out', date:p.paid_on, label:pname(p.worker_id), sub:`${w?.work_type || ''} · ${w?.job_title || w?.client_label || ''}${N(p.tds_amount) ? ' · TDS ' + money(p.tds_amount) : ''}`, acc:p.account_id, mode:p.mode, amt:-N(p.net_amount), open:() => openPayout(p.id)}); });
  S.expenses.forEach(e => rows.push({type:'exp', date:e.spent_on, label:e.category, sub:[pname(e.party_id), e.note, e.bill_no ? 'Bill ' + e.bill_no : ''].filter(Boolean).join(' · '), acc:e.account_id, mode:e.mode, amt:-N(e.amount), open:() => openExpense(e.id)}));
  S.transfers.forEach(t => { rows.push({type:'tr', date:t.moved_on, label:`${S.A.get(t.from_account_id)?.name} → ${S.A.get(t.to_account_id)?.name}`, sub:t.note || 'Transfer', acc:t.from_account_id, acc2:t.to_account_id, mode:null, amt:N(t.amount), open:() => openTransfer(null, t.id)}); });
  return rows.sort((a, b) => (b.date || '0').localeCompare(a.date || '0'));

   <tr><td colspan="2"><b>Total</b></td><td style="text-align:right"><b>${money(sum(mine, 'contract_amount'))}</b></td><td style="text-align:right"><b>${money(sum(mine, 'received'))}</b></td><td style="text-align:right"><b>${money(sum(mine, 'due'))}</b></td></tr></tbody></table>` : ''}
  ${rc.length ? `<h3>Payments received</h3><table><thead><tr><th>Date</th><th>Job</th><th>Method</th><th style="text-align:right">Amount</th></tr></thead><tbody>${rc.map(r => `<tr><td>${fdate(r.received_on) || '—'}</td><td>${esc(S.J.get(r.job_id)?.title || '')}</td><td>${MODES[r.mode] || '—'}</td><td style="text-align:right">${money(r.amount)}</td></tr>`).join('')}</tbody></table>` : ''}
  ${wo.length ? `<h3>Work given by TecArch</h3><table><thead><tr><th>Job</th><th>Work</th><th style="text-align:right">Agreed</th><th style="text-align:right">Paid</th><th style="text-align:right">Balance</th></tr></thead><tbody>${wo.map(w => `<tr><td>${esc(w.job_title || w.client_label || '')}</td><td>${esc(w.work_type)}</td><td style="text-align:right">${money(w.agreed_amount)}</td><td style="text-align:right">${money(w.paid)}</td><td style="text-align:right">${money(w.balance)}</td></tr>`).join('')}
   <tr><td colspan="2"><b>Total</b></td><td style="text-align:right"><b>${money(sum(wo, 'agreed_amount'))}</b></td><td style="text-align:right"><b>${money(sum(wo, 'paid'))}</b></td><td style="text-align:right"><b>${money(sum(wo, 'balance'))}</b></td></tr></tbody></table>` : ''}
  ${S.set.bank_details && N(p.receivable) > 0 ? `<h3>How to pay</h3><div class="pay">${esc(S.set.bank_details)}</div>` : ''}
  <div class="foot">${esc(S.set.company_name)} · ${esc(S.set.company_phone)} · ${esc(S.set.company_email)}</div>`, `Statement ${p.name} ${today()}`);
}

/* ================= REPORTS ================= */
function renderReports(){
  const tabs = [['monthly','Monthly in & out'],['profit','Profit by job'],['payers','Outstanding by payer'],['vat','VAT'],['tds','TDS']];
  $('#main').innerHTML = `<div class="phead"><div><h1>Reports</h1><p>For you, your auditor and tax filing. Each one can be exported to CSV.</p></div><div class="acts"><button class="btn" id="repCsv">Export CSV</button><button class="btn" id="repPrint">Print</button></div></div>
  <div class="toolbar"><div class="seg" id="repSeg">${tabs.map(([k, l]) => `<button data-k="${k}" class="${S.repTab === k ? 'on' : ''}">${l}</button>`).join('')}</div></div><div id="repBody"></div>`;
  $$('#repSeg button').forEach(b => b.onclick = () => { S.repTab = b.dataset.k; renderReports(); });
  const R = ({monthly:repMonthly, profit:repProfit, payers:repPayers, vat:repVat, tds:repTds})[S.repTab]();
  $('#repBody').innerHTML = R.html;
  $('#repCsv').onclick = () => csv(`tecarch-${S.repTab}-${today()}`, R.rows);
  $('#repPrint').onclick = () => printDoc(letterhead() + `<div class="ttl"><h1>${tabs.find(t => t[0] === S.repTab)[1].toUpperCase()}</h1><div class="meta">As on ${fdate(today())}</div></div>` + R.html.replace(/<svg[\s\S]*?<\/svg>/, ''), `TecArch ${S.repTab} ${today()}`);
}
function tableHtml(head, rows, numCols=[], foot){
  return `<div class="tablewrap"><table><thead><tr>${head.map((h, i) => `<th class="${numCols.includes(i) ? 'num' : ''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${numCols.includes(i) ? 'num' : ''}">${c}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${head.length}" class="empty">No data yet.</td></tr>`}</tbody>${foot ? `<tfoot><tr>${foot.map((c, i) => `<td class="${numCols.includes(i) ? 'num' : ''}">${c}</td>`).join('')}</tr></tfoot>` : ''}</table></div>`;
}
function repMonthly(){
  const m = S.monthly.slice(-12);
  const undated = S.receipts.filter(r => !r.received_on);
  const W = 760, H = 220, pad = 34, max = Math.max(1, ...m.map(x => Math.max(N(x.income), N(x.outsourcing) + N(x.expenses))));
  const bw = m.length ? (W - pad - 10) / m.length : 0;
  const svg = m.length ? `<svg class="chart" viewBox="0 0 ${W} ${H + 24}" role="img" aria-label="Monthly income and spending">
    ${[0, .5, 1].map(f => `<line x1="${pad}" x2="${W}" y1="${H - f * (H - 10)}" y2="${H - f * (H - 10)}" stroke="#e5e6e9"/><text x="${pad - 4}" y="${H - f * (H - 10) + 4}" font-size="10" text-anchor="end" fill="#6a707a">${f ? Math.round(max * f / 1000) + 'k' : '0'}</text>`).join('')}
    ${m.map((x, i) => { const x0 = pad + i * bw + bw * .15, w2 = bw * .33; const hi = N(x.income) / max * (H - 10), ho = N(x.outsourcing) / max * (H - 10), he = N(x.expenses) / max * (H - 10);
      return `<rect x="${x0}" y="${H - hi}" width="${w2}" height="${hi}" fill="#2c5282" rx="2"><title>${month(x.month)} income ${money(x.income)}</title></rect>
      <rect x="${x0 + w2 + 2}" y="${H - ho}" width="${w2}" height="${ho}" fill="#f37321" rx="2"><title>Outsourcing ${money(x.outsourcing)}</title></rect>
      <rect x="${x0 + w2 + 2}" y="${H - ho - he}" width="${w2}" height="${he}" fill="#c62828" rx="2"><title>Expenses ${money(x.expenses)}</title></rect>
      <text x="${x0 + w2}" y="${H + 16}" font-size="10" text-anchor="middle" fill="#6a707a">${month(x.month)}</text>`; }).join('')}</svg>
    <div class="legend"><span><i style="background:#2c5282"></i>Money in</span><span><i style="background:#f37321"></i>Outsourcing paid</span><span><i style="background:#c62828"></i>Expenses</span></div>` : '';
  const rows = S.monthly.slice().reverse();
  return { html: `<div class="sec">${svg || '<p class="muted">No dated transactions yet.</p>'}</div>
    ${undated.length ? `<div class="note">${undated.length} imported payments (${money(sum(undated, 'amount'))}) have no date, so they are not in this chart. Add dates where you know them.</div>` : ''}
    ${tableHtml(['Month','Money in','Outsourcing paid','Expenses','Net'], rows.map(x => [month(x.month), money(x.income), money(x.outsourcing), money(x.expenses), money(x.net)]), [1,2,3,4], ['Total', money(sum(rows, 'income')), money(sum(rows, 'outsourcing')), money(sum(rows, 'expenses')), money(sum(rows, 'net'))])}`,
    rows: [['Month','Money in','Outsourcing paid','Expenses','Net'], ...rows.map(x => [x.month, x.income, x.outsourcing, x.expenses, x.net])] };
}
function repProfit(){
  const list = S.jobs.filter(j => j.status !== 'cancelled' && (N(j.contract_amount) || N(j.outsourcing_cost))).sort((a, b) => N(a.profit) / Math.max(1, N(a.contract_amount)) - N(b.profit) / Math.max(1, N(b.contract_amount)));
  const pct = j => N(j.contract_amount) ? Math.round(N(j.profit) / N(j.contract_amount) * 100) + '%' : '—';
  return { html: `<div class="note blue">Sorted by margin, lowest first. Jobs where outsourcing eats most of the fee, or there is a cost but no fee recorded, are at the top.</div>` +
    tableHtml(['Code','Job','Agreed fee','Outsourcing','Other costs','Profit','Margin'], list.map(j => [esc(j.code || ''), esc(j.title), money(j.contract_amount), money(j.outsourcing_cost), money(j.expenses), `<span style="${N(j.profit) < 0 ? 'color:var(--red);font-weight:600' : ''}">${money(j.profit)}</span>`, pct(j)]), [2,3,4,5,6], ['', 'Total', money(sum(list, 'contract_amount')), money(sum(list, 'outsourcing_cost')), money(sum(list, 'expenses')), money(sum(list, 'profit')), sum(list, 'contract_amount') ? Math.round(sum(list, 'profit') / sum(list, 'contract_amount') * 100) + '%' : '']),
    rows: [['Code','Job','Agreed fee','Outsourcing','Other costs','Profit'], ...list.map(j => [j.code, j.title, j.contract_amount, j.outsourcing_cost, j.expenses, j.profit])] };
}
function repPayers(){
  const g = {}; openJobs().filter(j => N(j.due) > 0).forEach(j => { const k = j.bill_to_id || j.client_id; (g[k] ||= {name:j.bill_to_name, kind:j.bill_to_kind, jobs:[], due:0, last:null}); g[k].jobs.push(j); g[k].due += N(j.due); if(j.last_received && (!g[k].last || j.last_received > g[k].last)) g[k].last = j.last_received; });
  const list = Object.values(g).sort((a, b) => b.due - a.due);
  return { html: tableHtml(['Payer','Type','Jobs with balance','Last payment','Owes TecArch'], list.map(x => [`<b>${esc(x.name)}</b><span class="sub2">${x.jobs.map(j => esc(j.code || j.title)).join(', ')}</span>`, KINDS[x.kind] || '', x.jobs.length, x.last ? fdate(x.last) : '—', money(x.due)]), [2,4], ['Total', '', sum(list, x => x.jobs.length), '', money(sum(list, 'due'))]),
    rows: [['Payer','Type','Jobs','Job codes','Last payment','Owes'], ...list.map(x => [x.name, KINDS[x.kind], x.jobs.length, x.jobs.map(j => j.code).join(' '), x.last, x.due])] };
}
function repVat(){
  const g = {};
  S.invoices.filter(i => i.status !== 'void' && N(i.vat_amount) > 0).forEach(i => { const k = i.issue_date.slice(0, 7); (g[k] ||= {sales:0, out:0, inp:0}); g[k].sales += N(i.subtotal); g[k].out += N(i.vat_amount); });
  S.expenses.filter(e => N(e.vat_amount) > 0).forEach(e => { const k = e.spent_on.slice(0, 7); (g[k] ||= {sales:0, out:0, inp:0}); g[k].inp += N(e.vat_amount); });
  const ks = Object.keys(g).sort().reverse();
  return { html: `<div class="note blue">Output VAT comes from tax invoices issued here. Input VAT comes from expense bills where you entered a VAT amount. Check the figures with your auditor before filing.</div>` +
    tableHtml(['Month','Taxable sales','Output VAT (13%)','Input VAT on bills','VAT payable'], ks.map(k => [month(k + '-01'), money(g[k].sales), money(g[k].out), money(g[k].inp), money(g[k].out - g[k].inp)]), [1,2,3,4]),
    rows: [['Month','Taxable sales','Output VAT','Input VAT','Payable'], ...ks.map(k => [k, g[k].sales, g[k].out, g[k].inp, g[k].out - g[k].inp])] };
}
function repTds(){
  const g = {}; S.payouts.forEach(p => { const k = p.worker_id; (g[k] ||= {name:pname(k), pan:S.P.get(k)?.pan_vat, gross:0, tds:0, n:0}); g[k].gross += N(p.gross_amount); g[k].tds += N(p.tds_amount); g[k].n++; });
  const list = Object.values(g).sort((a, b) => b.gross - a.gross);
  return { html: `<div class="note blue">TDS withheld from outsourced professionals. It has to be deposited and reported by the deadline. Set each person's rate on their contact page.</div>` +
    tableHtml(['Person','PAN','Payments','Gross paid','TDS withheld','Net paid'], list.map(x => [esc(x.name), esc(x.pan || '—'), x.n, money(x.gross), money(x.tds), money(x.gross - x.tds)]), [2,3,4,5], ['Total', '', sum(list, 'n'), money(sum(list, 'gross')), money(sum(list, 'tds')), money(sum(list, 'gross') - sum(list, 'tds'))]),
    rows: [['Person','PAN','Payments','Gross','TDS','Net'], ...list.map(x => [x.name, x.pan, x.n, x.gross, x.tds, x.gross - x.tds])] };
}

/* ================= TO CHECK ================= */
function renderReview(){
  const jobs = S.jobs.filter(j => j.needs_review);
  const wos = S.wos.filter(w => w.needs_review);
  const merged = jobs.filter(j => /Merged/.test(j.review_note || ''));
  const nofee = jobs.filter(j => !/Merged/.test(j.review_note || ''));
  const unlinked = wos.filter(w => !w.job_id);
  const noamt = wos.filter(w => w.job_id);
  const sec = (t, sub, items) => items.length ? `<div class="sec"><h3>${t} <small>${sub}</small></h3><div class="rows">${items.join('')}</div></div>` : '';
  $('#main').innerHTML = `<div class="phead"><div><h1>To check</h1><p>Things from the Excel import that need your eyes. Fix or confirm each one, then mark it checked.</p></div></div>
  ${!jobs.length && !wos.length ? '<div class="sec empty">All checked. ✓</div>' : ''}
  ${sec('Same client in two sheets', 'merged as one fee, as you said. Confirm the amounts', merged.map(j => `<div class="row"><div class="grow"><b>${esc(jobLabel(j))}</b><small>${esc(j.review_note)}</small></div><div class="amt">${money(j.due)} due</div><div class="btns"><button class="btn sm" data-j="${j.id}">Open</button><button class="btn sm" data-jok="${j.id}">Looks right</button></div></div>`))}
  ${sec('Fee not recorded', 'a cost or project exists but no client fee was entered', nofee.map(j => `<div class="row"><div class="grow"><b>${esc(jobLabel(j))}</b><small>${esc(j.review_note)}${N(j.outsourcing_cost) ? ' · outsourcing cost ' + money(j.outsourcing_cost) : ''}</small></div><div class="btns"><button class="btn sm" data-j="${j.id}">Enter fee</button>${S.admin ? `<button class="btn sm ghost" data-jcancel="${j.id}">Not a paid job</button>` : ''}</div></div>`))}
  ${sec('Outsourced work not linked to a job', 'pick the job so its cost counts against the right project', unlinked.map(w => `<div class="row"><div class="grow"><b>${esc(w.worker_name)} · ${esc(w.client_label || '')}</b><small>${esc(w.work_type)} · ${money(w.agreed_amount)}</small></div><select data-link="${w.id}" style="width:auto;max-width:300px">${jobOptions(null)}</select><button class="btn sm" data-wok="${w.id}">No job</button></div>`))}
  ${sec('Outsourced work with no amount', '', noamt.map(w => `<div class="row"><div class="grow"><b>${esc(w.worker_name)} · ${esc(w.job_title || w.client_label || '')}</b><small>${esc(w.review_note || '')}</small></div><button class="btn sm" data-w="${w.id}">Open</button></div>`))}`;
  $$('[data-j]').forEach(b => b.onclick = () => openJob(Number(b.dataset.j)));
  $$('[data-w]').forEach(b => b.onclick = () => openWO(Number(b.dataset.w)));
  $$('[data-jok]').forEach(b => b.onclick = async () => { await sb.from('fin_jobs').update({needs_review:false}).eq('id', b.dataset.jok); refresh(); });
  $$('[data-jcancel]').forEach(b => b.onclick = async () => { await sb.from('fin_jobs').update({needs_review:false, status:'cancelled', notes:(S.J.get(Number(b.dataset.jcancel)).notes || '') + ' · Marked as not a paid job'}).eq('id', b.dataset.jcancel); refresh(); });
  $$('[data-wok]').forEach(b => b.onclick = async () => { await sb.from('fin_work_orders').update({needs_review:false}).eq('id', b.dataset.wok); refresh(); });
  $$('[data-link]').forEach(s => s.onchange = async () => { if(!s.value) return; const { error } = await sb.from('fin_work_orders').update({job_id:Number(s.value), needs_review:false}).eq('id', s.dataset.link); if(error) return fail(error); toast('Linked'); refresh(); });
}

boot();
</script>
